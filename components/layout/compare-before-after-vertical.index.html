<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Unbounded"; src: url("assets/fonts/Unbounded.ttf") format("truetype"); font-weight: 200 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #1d2f5c; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #1d2f5c; font-family: "Unbounded", system-ui, sans-serif; }
      /* переливающийся градиент синий ↔ серо-голубой, как в образце raw-vs-edited */
      #bg { position: absolute; inset: 0; background: linear-gradient(170deg, #1d2f5c 0%, #c9d3e6 33%, #1d2f5c 66%, #c9d3e6 100%); background-size: 100% 300%; background-position: 50% 0%; }
      .lbl { position: absolute; top: 436px; width: 500px; text-align: center; color: #fff; font-size: 33px; font-weight: 800; letter-spacing: -0.02em; text-transform: uppercase; text-shadow: 0 2px 4px rgba(0,0,0,0.45), 0 0 22px rgba(10,20,50,0.55); white-space: nowrap; }
      #lbl-raw { left: 27px; }
      #lbl-ed { left: 553px; }
      #lbl-ed b { color: #d8ff3c; font-weight: 900; }
      .card { position: absolute; top: 515px; width: 500px; height: 889px; border-radius: 28px; overflow: hidden; box-shadow: 0 30px 90px rgba(0,0,0,0.45); background: #000; }
      #card-raw { left: 27px; }
      #card-ed { left: 553px; }
      .card video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #zw { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
      #zw-in { position: absolute; inset: 0; transform-origin: 50% 35%; }
      #zal { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20.7" data-width="1080" data-height="1920">
      <div id="bg"></div>
      <div class="lbl" id="lbl-raw">До</div>
      <div class="lbl" id="lbl-ed">После <b>ИИ монтажа</b></div>
      <div class="card" id="card-raw" data-layout-allow-overflow>
        <video id="raw" class="clip" src="assets/raw.mp4" data-start="0" data-duration="14.3667" data-track-index="0" muted playsinline></video>
      </div>
      <div class="card" id="card-ed" data-layout-allow-overflow>
        <video id="edited" class="clip" src="assets/edited.mp4" data-start="0" data-duration="14.3667" data-track-index="1" muted playsinline></video>
      </div>
      <div id="zw" data-layout-allow-overflow>
        <div id="zw-in" data-layout-allow-overflow>
          <video id="zal" class="clip" src="assets/zal.mp4" data-start="14.3667" data-duration="6.3333" data-track-index="3" muted playsinline></video>
        </div>
      </div>
      <audio id="voice" src="assets/voice.wav" data-start="0" data-duration="20.7" data-track-index="9" data-volume="1"></audio>
      <div id="h-captions" data-clip="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0.0" data-duration="20.7" data-track-index="5" data-track-kind="captions" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      (() => {
        /*CUES:BEGIN*/const C = {"zero": 0.0, "end": 20.7, "zIn": 14.3667, "zFree": 15.1667, "zPap": 15.6667, "zMon": 16.9333, "zDla": 17.4667, "zWord": 18.5}; const T0 = 0;/*CUES:END*/
        const tl = gsap.timeline({ paused: true });
        const T1 = C.zIn;
        // фон переливается весь ролик
        tl.fromTo("#bg", { backgroundPosition: "50% 0%" }, { backgroundPosition: "50% 100%", duration: T1 / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
        // вход: подписи сверху, карточки снизу
        tl.from(".lbl", { autoAlpha: 0, y: -30, duration: 0.4, stagger: 0.08, ease: "power3.out" }, 0);
        tl.from(".card", { autoAlpha: 0, y: 80, scale: 0.94, duration: 0.45, stagger: 0.08, ease: "back.out(1.6)" }, 0);
        // переход: карточки уходят, пока их видео ещё играет; концовка — встык, без въезда
        // (въезд показывал субтитр раньше видео и пустые тёмные карточки)
        tl.to(".lbl", { autoAlpha: 0, y: -30, duration: 0.25, ease: "power2.in" }, T1 - 0.3);
        tl.to(".card", { autoAlpha: 0, scale: 0.9, duration: 0.3, stagger: 0.03, ease: "power2.in" }, T1 - 0.33);
        // концовка во весь экран: удары зумом на ключевых словах
        tl.set("#zw", { visibility: "visible" }, T1);
        tl.set("#zw-in", { scale: 1 }, T1);
        tl.set("#zw-in", { scale: 1.14 }, C.zFree - 0.05);
        tl.set("#zw-in", { scale: 1 }, C.zPap - 0.05);
        tl.set("#zw-in", { scale: 1.1 }, C.zMon - 0.05);
        tl.set("#zw-in", { scale: 1 }, C.zDla - 0.05);
        tl.set("#zw-in", { scale: 1.18 }, C.zWord - 0.05);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
