<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: #f4f2ee;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f4f2ee;
      }
      /* фон: светлый / тёмный с крупными «шевронами» у краёв, как в образце */
      .bg {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #bg-light {
        background: #f4f2ee;
      }
      #bg-dark {
        background: #17181a;
      }
      .chev {
        position: absolute;
        width: 760px;
        height: 380px;
        border-radius: 40px;
      }
      #bg-light .chev {
        background: #ebe8e2;
      }
      #bg-dark .chev {
        background: #1d1e21;
      }
      .chev.a {
        left: -420px;
        top: -60px;
        transform: rotate(-32deg);
      }
      .chev.b {
        right: -430px;
        top: 420px;
        transform: rotate(-32deg);
      }
      .chev.c {
        left: -380px;
        top: 900px;
        transform: rotate(28deg);
      }
      /* окно спикера: прямоугольник снизу по центру, стоит весь ролик */
      #spk {
        position: absolute;
        left: 250px;
        top: 806px;
        width: 580px;
        height: 500px;
        border-radius: 36px;
        overflow: hidden;
        box-shadow:
          0 0 0 2px rgba(255, 255, 255, 0.75),
          0 30px 80px rgba(0, 0, 0, 0.35);
        background: #222;
      }
      #aroll {
        position: absolute;
        left: 0;
        top: -150px;
        width: 580px;
        height: 1031px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="45.5667" data-width="1080" data-height="1350">
      <div id="bg-light" class="bg" data-layout-allow-overflow>
        <div class="chev a"></div>
        <div class="chev b"></div>
        <div class="chev c"></div>
      </div>
      <div id="bg-dark" class="bg" data-layout-allow-overflow>
        <div class="chev a"></div>
        <div class="chev b"></div>
        <div class="chev c"></div>
      </div>

      <div id="spk" data-layout-allow-overflow>
        <video id="aroll" class="clip" src="assets/cut.mp4" data-start="0" data-duration="45.5667" data-track-index="0" muted playsinline></video>
      </div>
