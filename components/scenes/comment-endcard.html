<!doctype html>
<html lang="ru">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="styles-promo.css" />
      <style>
        @font-face { font-family: "Unbounded"; src: url("assets/fonts/Unbounded.ttf") format("truetype"); font-weight: 200 900; }
        #s12-root { position: absolute; inset: 0; overflow: hidden; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
        #s12-bg { background: var(--red); }
        #s12-h { position: absolute; left: 0; right: 0; top: 340px; text-align: center; font-size: 96px; font-weight: 900; }
        #s12-h2 { position: absolute; left: 0; right: 0; top: 460px; text-align: center; font-size: 60px; font-weight: 800; color: var(--cream); }
        #s12-box { position: absolute; left: 80px; right: 80px; top: 640px; padding: 34px 34px 38px; color: var(--ink); }
        #s12-lbl { font-size: 30px; font-weight: 700; color: var(--muted); margin-bottom: 24px; }
        #s12-input { display: flex; align-items: center; gap: 20px; }
        #s12-field { flex: 1; height: 120px; border-radius: 60px; background: #fff; border: 4px solid rgba(20,20,20,0.12); display: flex; align-items: center; padding: 0 40px; font-size: 64px; font-weight: 900; }
        #s12-caret { width: 6px; height: 64px; background: var(--red); margin-left: 6px; }
        #s12-send { width: 120px; height: 120px; border-radius: 50%; background: var(--red); display: flex; align-items: center; justify-content: center; }
        #s12-chars span { visibility: hidden; }
        #s12-brand { position: absolute; left: 80px; right: 80px; top: 1080px; display: flex; flex-direction: column; align-items: center; gap: 24px; }
        #s12-logo { width: 200px; height: 200px; border-radius: 50%; overflow: hidden; border: 8px solid var(--cream); box-shadow: var(--shadow); }
        #s12-logo img { width: 100%; height: 100%; object-fit: cover; }
        #s12-name { font-size: 58px; font-weight: 900; text-align: center; }
        #s12-sub { font-size: 36px; font-weight: 600; opacity: 0.9; }
        #s12-icons { display: flex; gap: 26px; margin-top: 4px; }
        #s12-icons img { width: 92px; height: 92px; border-radius: 24px; }
        #s12-icons img + img { border-radius: 50%; }
      </style>
      <div id="s12-root" data-composition-id="s12" data-width="1080" data-height="1920">
        <div id="s12-bg" class="field"></div>
        <div id="s12-h" class="disp">напиши</div>
        <div id="s12-h2" class="disp">в комментариях</div>
        <div id="s12-box" class="panel">
          <div id="s12-lbl">Добавьте комментарий…</div>
          <div id="s12-input">
            <div id="s12-field"><span id="s12-chars" class="disp"><span>К</span><span>И</span><span>К</span><span>И</span></span><div id="s12-caret"></div></div>
            <div id="s12-send"><svg width="56" height="56" viewBox="0 0 24 24"><path d="M3 11 21 4l-6 17-3-7z" fill="#fff" /></svg></div>
          </div>
        </div>
        <div id="s12-brand">
          <div id="s12-logo"><img src="assets/logo.jpg" alt="" /></div>
          <div id="s12-name" class="disp">Освобождаем руки</div>
          <div id="s12-sub">Внедрение ИИ для монтажа</div>
          <div id="s12-icons"><img src="assets/instagram.svg" alt="" /><img src="assets/telegram.png" alt="" /></div>
        </div>
      </div>
      <script>
        (() => {
          /*CUES:BEGIN*/const C = {"zero": 0.0, "end": 44.8333, "s1Rolik": 0.2333, "s1Neuro": 1.1333, "s2In": 1.7667, "s2Sell": 2.7667, "s2Strike": 3.3667, "s3In": 4.0333, "s3Give": 4.5667, "s3Free": 5.6667, "s4In": 6.2667, "s4Two": 6.8667, "s4Folder": 8.3, "s4Edit": 9.8, "s5In": 11.1667, "s5Hdr": 11.3333, "k1": 12.9333, "k2": 13.3333, "k3": 14.0, "k4": 15.4333, "s6In": 16.3333, "t1": 17.2667, "t2": 18.4, "t3": 19.2, "t4": 19.5333, "t5": 19.8667, "t6": 20.3667, "s7In": 21.8667, "fsIn": 23.7667, "fsTwo": 24.4333, "fsDays": 24.6333, "s9In": 25.2667, "igSub": 26.7333, "tgGo": 27.9667, "tgSub": 30.4, "s10In": 31.2667, "s10Free": 32.5667, "s10Doc": 33.1333, "s10File": 34.8333, "s11In": 35.5333, "s11Ls": 38.3667, "s11Send": 38.6333, "s12In": 40.7333, "s12Write": 41.2667, "s12Kiki": 42.0667, "endIn": 43.1667}; const T0 = 40.7333;/*CUES:END*/
          const L = (k) => C[k] - T0;
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s12-bg", { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(75% at 50% 50%)", duration: 0.45, ease: "power3.inOut" }, 0.05);
          tl.fromTo("#s12-h", { autoAlpha: 0, scale: 1.8 }, { autoAlpha: 1, scale: 1, duration: 0.28, ease: "power4.out" }, Math.max(0.4, L("s12Write") - 0.1));
          tl.fromTo("#s12-box", { autoAlpha: 0, y: 80 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "back.out(1.7)" }, L("s12Write") + 0.15);
          // каретка мигает, буквы печатаются на слове «КИКИ»
          for (let t = L("s12Write") + 0.15; t < L("endIn") + 2; t += 0.5) {
            tl.set("#s12-caret", { opacity: 1 }, t);
            tl.set("#s12-caret", { opacity: 0 }, t + 0.25);
          }
          document.querySelectorAll("#s12-chars span").forEach((el, i) => {
            tl.set(el, { visibility: "visible" }, L("s12Kiki") - 0.05 + i * 0.08);
          });
          tl.fromTo("#s12-h2", { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.25, ease: "power3.out" }, L("s12Kiki") + 0.3);
          tl.to("#s12-send", { scale: 0.85, duration: 0.08, yoyo: true, repeat: 1 }, L("s12Kiki") + 0.55);
          // финал под дроп музыки
          tl.fromTo("#s12-logo", { autoAlpha: 0, scale: 0.3 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, L("endIn"));
          tl.fromTo("#s12-name", { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out" }, L("endIn") + 0.15);
          tl.fromTo("#s12-sub", { autoAlpha: 0 }, { autoAlpha: 0.9, duration: 0.3 }, L("endIn") + 0.3);
          tl.fromTo("#s12-icons img", { autoAlpha: 0, scale: 0.4 }, { autoAlpha: 1, scale: 1, duration: 0.28, stagger: 0.1, ease: "back.out(2.2)" }, L("endIn") + 0.45);
          window.__timelines["s12"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
