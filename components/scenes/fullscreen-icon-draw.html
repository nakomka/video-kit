<!doctype html>
<html lang="ru">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="styles.css" />
      <style>
        #fs2-root { position: absolute; inset: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); overflow: hidden; }
        #fs2-bg { background: var(--green); }
        #fs2-bg2 { background: #fcfbf8; }
        #fs2-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; color: #fff; }
        #fs2-pre { font-size: 66px; font-weight: 650; }
        #fs2-icon { width: 300px; height: 360px; }
        #fs2-one { font-size: 150px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; }
        #fs2-plus { padding: 18px 44px 24px; border-radius: 28px; background: #fff; color: var(--pink); font-size: 76px; font-weight: 850; letter-spacing: -0.02em; box-shadow: var(--shadow); }
      </style>
      <div id="fs2-root" data-composition-id="fs2" data-width="1080" data-height="1920">
        <div id="fs2-bg2" class="field"></div>
        <div id="fs2-bg" class="field"></div>
        <div id="fs2-wrap">
          <div id="fs2-pre">Всё, что нужно:</div>
          <svg id="fs2-icon" viewBox="0 0 300 360">
            <path id="fs2-p1" d="M24 20 H196 L276 100 V340 H24 Z" fill="none" stroke="#fff" stroke-width="16" stroke-linejoin="round" />
            <path id="fs2-p2" d="M196 20 V100 H276" fill="none" stroke="#fff" stroke-width="16" stroke-linejoin="round" />
            <path id="fs2-p3" d="M74 180 H226 M74 230 H226 M74 280 H170" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" />
          </svg>
          <div id="fs2-one">1 файл</div>
          <div id="fs2-plus">+ короткий промпт</div>
        </div>
      </div>
      <script>
        (() => {
          /*CUES:BEGIN*/const C = {"s1In": 0.0, "hitCC": 1.0333, "hitSolo": 2.5667, "s2In": 3.1, "hitFile": 3.7, "hitTwo": 4.9, "s3In": 5.8667, "c1": 7.0667, "c2": 8.1667, "c3": 8.8333, "fs1In": 9.5667, "six": 10.4667, "comp": 10.6333, "s5In": 11.6333, "t1": 12.2333, "t2": 13.4, "t3": 14.2, "t4": 14.8667, "t5": 15.2333, "t6": 16.3, "s6In": 17.3, "hdr": 17.6667, "k1": 20.4, "k2": 21.2, "k3": 21.9, "k4": 23.9, "s7In": 24.4, "pod": 26.3, "style": 27.2667, "fs2In": 27.7333, "fileW": 29.5333, "prompt": 30.9333, "s9In": 31.8333, "gear": 32.5, "strike": 33.1667, "endIn": 34.2, "end": 36.7}; const T0 = 27.7333;/*CUES:END*/
          const L = (k) => C[k] - T0;
          const END = C.s9In - T0;
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#fs2-bg2", { clipPath: "inset(0 0 0 100%)" }, { clipPath: "inset(0 0 0 0%)", duration: 0.28, ease: "power3.inOut" }, 0);
          tl.fromTo("#fs2-bg", { clipPath: "inset(0 0 0 100%)" }, { clipPath: "inset(0 0 0 0%)", duration: 0.32, ease: "power3.inOut" }, 0.06);
          tl.fromTo("#fs2-pre", { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.22);
          // иконка файла рисуется линией на слове «скачать мой файл»
          [["#fs2-p1", 900], ["#fs2-p2", 170], ["#fs2-p3", 420]].forEach(([id, len], i) => {
            tl.fromTo(id, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, L("fileW") - 0.45 + i * 0.12);
          });
          tl.fromTo("#fs2-one", { autoAlpha: 0, y: 60 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "back.out(1.8)" }, L("fileW"));
          tl.fromTo("#fs2-plus", { autoAlpha: 0, y: 80, scale: 0.8 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2)" }, L("prompt"));
          tl.to("#fs2-wrap", { autoAlpha: 0, y: -80, duration: 0.2, ease: "power2.in" }, END - 0.32);
          tl.to("#fs2-bg", { clipPath: "inset(0 100% 0 0)", duration: 0.3, ease: "power3.inOut" }, END - 0.3);
          tl.to("#fs2-bg2", { clipPath: "inset(0 100% 0 0)", duration: 0.3, ease: "power3.inOut" }, END - 0.26);
          window.__timelines["fs2"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
